# Glyph — Continuous Integration
#
# Runs on every push and pull request. Validates build, test, and
# coding standards.

name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

env:
  ALIRE_VERSION: '2.0.0'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Alire dependencies
        uses: actions/cache@v4
        with:
          path: ~/.alire
          key: alire-${{ hashFiles('alire.toml') }}
          restore-keys: alire-

      - name: Install GNAT Ada compiler
        uses: ada-lang/setup-gnat@v2
        with:
          version: latest

      - name: Install Alire
        run: |
          curl -L -o alr.tar.gz \
            "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-x86_64-linux.gz"
          gunzip -c alr.tar.gz > alr
          chmod +x alr
          sudo mv alr /usr/local/bin/

      - name: Build library
        run: alr build

      - name: Run unit tests
        run: alr test

      - name: Check coding standards
        run: |
          pip install pre-commit
          pre-commit run --all-files

  lint:
    name: Lint and format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GNAT Ada compiler
        uses: ada-lang/setup-gnat@v2
        with:
          version: latest

      - name: Check Ada source formatting
        run: |
          # Placeholder: run gnatcheck or adafmt when configured
          echo "Formatting check will be configured in a future release."
