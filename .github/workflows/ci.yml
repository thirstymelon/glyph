# Glyph — Continuous Integration
#
# Runs on every push and pull request. Validates build and code quality.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Alire dependencies
        uses: actions/cache@v4
        with:
          path: ~/.local/share/alire
          key: alire-${{ hashFiles('alire.toml') }}
          restore-keys: alire-

      - name: Install Alire and GNAT toolchain
        uses: alire-project/setup-alire@v2

      - name: Build library
        run: alr build

      - name: Check Ada source formatting
        run: |
          if [ -n "$(find src -name '*.ads' -o -name '*.adb' 2>/dev/null | head -1)" ]; then
            echo "Source formatting check will be enabled when adafmt is configured."
          else
            echo "No Ada source files yet — skipping formatting check."
          fi
