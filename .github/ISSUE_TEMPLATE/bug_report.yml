name: Bug report
description: Report a defect or unexpected behaviour
title: '[Bug]: '
labels: [bug]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in the information below to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behaviour.
      placeholder: |
        1. Create a framebuffer of size 128x64
        2. Call Draw_Line with coordinates (10,10) to (120,50)
        3. Observe that the line is missing pixels at the endpoint
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal reproducible example
      description: Please provide a minimal code example that demonstrates the issue.
      render: ada

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of Glyph are you using?
      placeholder: 'e.g., v0.1.0, main branch'
    validations:
      required: true

  - type: input
    id: compiler
    attributes:
      label: Compiler version
      description: Which GNAT compiler version are you using?
      placeholder: 'e.g., GNAT Community 2021, FSF GNAT 13.2'
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Board and display you are using (if applicable).
      placeholder: 'e.g., Raspberry Pi Pico + SSD1306 128x64'

  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Include any relevant log output or error messages.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I have searched the issue tracker for a similar issue.
          required: true
        - label: I have verified I am using a supported version.
          required: true
