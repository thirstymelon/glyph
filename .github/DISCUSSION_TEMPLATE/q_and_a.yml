title: "Q&A: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Ask a question about using Glyph. Before posting, please check the [FAQ](https://github.com/glyph-ada/glyph/blob/main/FAQ.md) and documentation.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Describe what you are trying to achieve and what you need help with.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you working on? What have you tried so far?

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of Glyph are you using?

  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Board and display (if applicable).
